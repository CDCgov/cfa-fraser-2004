[project]
name = "fraser"
version = "0.1.0"
description = "Deterministic outbreak-control thresholds from Fraser et al. (2004)"
readme = "README.md"
authors = [
    { name = "Scott Olesen", email = "2549395+swo@users.noreply.github.com" },
]
requires-python = ">=3.13"
dependencies = [
    "altair>=5.5",
    "numpy>=2.0",
    "scipy>=1.14",
    "vl-convert-python>=1.7",
]

[project.scripts]
fraser = "fraser:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]
docs = [
    "mkdocs-autoapi>=0.4.1",
    "mkdocstrings-python>=2.0.10",
    "zensical>=0.0.73",
]
